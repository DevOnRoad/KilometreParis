<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#B82928;
  --blue:#2F3E86;
  --yellow:#FFF8BD;
  --ink:#171717;
  --paper:#F7F5EE;
  --blanc:#FFFFFF
}
html{scroll-behavior:smooth}
body{
  font-family:Barlow,sans-serif;
  background:var(--paper);
  color:var(--ink);
  overflow-x:hidden
}
img{display:block}

/* ── HERO PHOTO (même principe que la vidéo de About Us) ── */
.hero-photo{position:relative;width:100%;height:calc(100vh - 72px);min-height:480px;overflow:hidden;background:var(--ink)}
.hero-photo img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center
}
.hero-photo-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.1) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:4rem 5rem;gap:1.5rem
}
.hero-eyebrow{
  font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.45em;text-transform:uppercase;color:rgba(255,255,255,.6)
}
.hero-title{
  font-family:'Barlow Condensed',sans-serif;font-size:clamp(3.2rem,7vw,8rem);font-weight:900;
  text-transform:uppercase;line-height:.88;letter-spacing:-.03em;color:var(--blanc)
}
.hero-title span{color:var(--yellow)}

.hero-grid{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.65) 2px,transparent 2px),
    linear-gradient(to right,rgba(255,255,255,.65) 2px,transparent 2px),
    linear-gradient(to bottom,rgba(255,255,255,.65) 2px,transparent 2px),
    linear-gradient(to bottom,rgba(255,255,255,.65) 2px,transparent 2px);
  background-position:33.333% 0,66.666% 0,0 33.333%,0 66.666%;
  background-size:2px 100%,2px 100%,100% 2px,100% 2px;
  background-repeat:no-repeat
}

@media(max-width:900px){
  .hero-photo{height:calc(88svh - 72px);min-height:480px}
  .hero-photo-overlay{padding:2rem 1.5rem;gap:1rem}
  .hero-title{font-size:clamp(2.6rem,13vw,6rem)}
}
@media(max-width:480px){
  .hero-photo-overlay{padding:1.5rem 1.1rem}
  .hero-title{font-size:clamp(2.3rem,12vw,3.6rem)}
  .hero-eyebrow{letter-spacing:.3em}
}

/* ── INTRO VIDEO (loader plein écran) ── */
html.intro-lock,html.intro-lock body{overflow:hidden}
#intro-loader{
  position:fixed;inset:0;z-index:9999;background:#000;
  opacity:1;transition:opacity .9s ease
}
#intro-loader.done{opacity:0;pointer-events:none}
#intro-loader video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center
}
.intro-skip{
  position:absolute;bottom:2rem;right:2rem;z-index:2;
  background:rgba(23,23,23,.55);border:1px solid rgba(255,255,255,.35);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.3em;text-transform:uppercase;
  padding:.85rem 1.4rem;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(4px);transition:background .2s
}
.intro-skip:hover{background:rgba(23,23,23,.8)}
@media(max-width:900px){.intro-skip{bottom:1.25rem;right:1.25rem}}
</style>
<noscript><style>#intro-loader{display:none}html.intro-lock,html.intro-lock body{overflow:auto}</style></noscript>
</head>

<body>
<!-- INTRO VIDEO : joue en plein écran, puis révèle la page -->
<div id="intro-loader" aria-label="Intro video">
  <video id="intro-video" muted playsinline preload="auto" poster="./fashionWeek/fw.jpg">
    <source src="./videos/PierreFlorentcollaborationwithBejeweledAdventures.mp4" type="video/mp4">
  </video>
  <button class="intro-skip" id="intro-skip" type="button">Skip</button>
</div>

<script src="navbar.js"></script>

<!-- HERO PHOTO -->
<section class="hero-photo">
  <img src="./fashionWeek/fw.jpg" alt="Bejeweled Adventures — Pierre &amp; Florent, Fashion Week Kilometre Paris">

  <div class="hero-photo-overlay">
    <span class="hero-eyebrow">Fashion Week</span>
    <h1 class="hero-title">Bejeweled<br>Adventures<br><span>Pierre &amp; Florent</span></h1>
  </div>

  <div class="hero-grid" aria-hidden="true"></div>
</section>

<script src="footer.js"></script>


<script>
(function(){
  var loader=document.getElementById('intro-loader');
  var video=document.getElementById('intro-video');
  var skip=document.getElementById('intro-skip');
  var finished=false, startTimer;

  function reveal(){
    if(finished) return;
    finished=true;
    clearTimeout(startTimer);
    document.documentElement.classList.remove('intro-lock');
    loader.classList.add('done');
    try{video.pause();}catch(e){}
    setTimeout(function(){ if(loader.parentNode) loader.parentNode.removeChild(loader); },1000);
  }

  if(!loader||!video){ reveal(); return; }

  video.addEventListener('ended',reveal);
  video.addEventListener('error',reveal);
  var src=video.querySelector('source');
  if(src) src.addEventListener('error',reveal); /* erreur de fichier : l'event part de <source> */
  skip.addEventListener('click',reveal);

  /* Si la vidéo ne démarre pas (réseau lent, lecture bloquée), on n'enferme pas le visiteur */
  startTimer=setTimeout(reveal,8000);
  video.addEventListener('playing',function(){ clearTimeout(startTimer); });

  var p=video.play();
  if(p&&p.catch) p.catch(reveal);
})();
</script>

</body>
</html>
